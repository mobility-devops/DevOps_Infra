---
# Sealed Secrets 열쇠 복원. 클러스터를 새로 만들 때 argocd.yml 다음, CD의 root 등록 전에 실행한다.
# 실행: cd ansible && ansible-playbook playbooks/sealed-secrets-restore.yml
# 열쇠 백업은 vault 로 암호화돼 있다. devops-server 에서는 ANSIBLE_VAULT_PASSWORD_FILE(~/.bashrc)로 자동 입력, 다른 곳에서는 --ask-vault-pass.
- name: Restore Sealed Secrets keys
  hosts: k8s_master
  become: true

  roles:
    - sealed_secrets_restore
