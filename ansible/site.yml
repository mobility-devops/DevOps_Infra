# 전체 적용: ansible-playbook site.yml
# 일부만:    ansible-playbook site.yml --limit k8s-master
# role 은 아직 빈 틀이다. 각 role 의 tasks/main.yml 을 채워 나간다(README §8).

- name: 공통 설정 (VM 7대)
  hosts: vms
  become: true
  roles: [common]

- name: 물리 머신 (호스트·노트북)
  hosts: machines
  become: true
  roles: [host]

- name: Kubernetes 노드 공통
  hosts: k8s_master:k8s_workers
  become: true
  roles: [k8s_node]

- name: Kubernetes Control Plane
  hosts: k8s_master
  become: true
  roles: [k8s_master]

- name: Kubernetes worker
  hosts: k8s_workers
  become: true
  roles: [k8s_worker]

- name: MySQL
  hosts: db
  become: true
  roles: [mysql]

- name: Jenkins
  hosts: ci
  become: true
  roles: [jenkins]

- name: 모니터링
  hosts: mon
  become: true
  roles: [monitoring]
