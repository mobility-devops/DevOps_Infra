# 대상: VM 7대(vms) + 물리 머신 2대(machines). 주소는 모두 br-lab(192.168.56.0/24).
# 이름은 VM hostname 과 같게 둔다. /etc/hosts 도 이 목록으로 만든다(roles/common).
all:
  children:
    vms:
      vars:
        ansible_user: devops
      children:
        ci:
          hosts:
            ci-01: {ansible_host: 192.168.56.11}
        k8s_master:
          hosts:
            k8s-master: {ansible_host: 192.168.56.21}
        k8s_workers:
          hosts:
            k8s-worker1: {ansible_host: 192.168.56.22}
            k8s-worker2: {ansible_host: 192.168.56.23}
            k8s-worker3: {ansible_host: 192.168.56.24}
        db:
          hosts:
            db-01: {ansible_host: 192.168.56.31}
        mon:
          hosts:
            mon-01: {ansible_host: 192.168.56.41}

    # 물리 머신. host role(예정)에서 다룬다. site.yml 의 common 은 vms 에만 적용한다.
    machines:
      hosts:
        lab-host:
          ansible_host: 192.168.56.1
          ansible_connection: local
        lab-laptop:
          ansible_host: 192.168.56.2
          # ansible_user: <노트북 관리 계정>  # host role 작성 시 정한다
