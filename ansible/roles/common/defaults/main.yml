# SSH 접속을 허용할 계정. devops: 팀원·Ansible, vagrant: `vagrant ssh`·`vagrant provision`(키 배포)용.
# Ansible 이 접속하는 계정이 빠져 있으면 role 이 시작 전에 멈춘다(잠금 방지).
ssh_allow_users:
  - devops
  - vagrant

# fail2ban: 호스트(.1)는 차단하지 않는다. SNAT 를 끄기 전에는 Tailscale 팀원도 모두 .1 로 보인다.
fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - "{{ lab_host_ip }}"
fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5

# node_exporter 는 br-lab 주소에서만 연다(mon-01 과 노드끼리 수집).
node_exporter_listen: "{{ ansible_host }}:9100"

# Tailscale 복귀 경로: 팀원(100.64.0.0/10)에게 가는 응답을 호스트로 보낸다. 호스트 SNAT 를 끈 뒤에 필요하다.
tailscale_return_route: true
