# sshd 는 같은 설정이 여러 번 나오면 처음 값을 쓴다. 10- 으로 두어 50-cloud-init.conf 등보다 앞서게 한다.
- name: sshd 하드닝 설정
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

- name: 전체 sshd 설정 검사
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
