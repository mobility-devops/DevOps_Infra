# SSH 하드닝으로 스스로를 잠그지 않도록, 지금 접속한 계정이 허용 목록에 있는지 먼저 본다.
# 이 play 가 여기까지 왔다면 그 계정의 키 로그인은 이미 동작하는 것이다.
- name: 접속 계정이 ssh_allow_users 에 있는지 확인
  ansible.builtin.assert:
    that: (ansible_user | default(lookup('config', 'DEFAULT_REMOTE_USER'))) in ssh_allow_users
    fail_msg: >-
      접속 계정 {{ ansible_user | default(lookup('config', 'DEFAULT_REMOTE_USER')) }} 이
      ssh_allow_users {{ ssh_allow_users }} 에 없습니다. 적용하면 SSH 로 다시 들어올 수 없습니다.
    quiet: true

- name: br-lab 인터페이스와 주소 확인
  ansible.builtin.assert:
    that:
      - lab_iface in ansible_facts.interfaces
      - ansible_facts[lab_iface].ipv4.address | default('') == ansible_host
    fail_msg: "{{ lab_iface }} 에 {{ ansible_host }} 가 없습니다. Vagrant 네트워크 설정을 확인하세요."
    quiet: true
