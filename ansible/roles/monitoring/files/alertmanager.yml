route:
  receiver: slack-warning
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['alertname="Watchdog"']
      receiver: healthchecks
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m        # 기본 4h면 healthchecks가 끊긴 것으로 판단
    - matchers: ['severity="critical"']
      receiver: slack-critical
      repeat_interval: 1h

receivers:
  - name: healthchecks
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/healthchecks_watchdog
        send_resolved: false
  - name: slack-critical
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_critical
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }} ({{ .Labels.instance }}){{ "\n" }}Runbook: {{ .Annotations.runbook_url }}{{ "\n" }}{{ end }}'
  - name: slack-warning
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_warning
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }} ({{ .Labels.instance }}){{ "\n" }}Runbook: {{ .Annotations.runbook_url }}{{ "\n" }}{{ end }}'

inhibit_rules:
  - source_matchers: ['alertname="LaptopLinkDown"']
    target_matchers: ['alertname=~"LaptopTargetDown|Worker3NotReady"']
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, instance, mountpoint]     # mountpoint 가 없는 경보는 양쪽 모두 빈 값이라 그대로 같다고 봄
