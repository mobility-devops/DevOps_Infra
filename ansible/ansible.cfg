# 호스트 PC 의 이 디렉터리(ansible/)에서 실행한다: cd ansible && ansible-playbook site.yml
[defaults]
inventory = inventory/hosts.yml
remote_user = devops
# Ansible 전용 키(keys/ansible.pub 의 짝). 경로가 다르면 ANSIBLE_PRIVATE_KEY_FILE 로 바꾼다.
private_key_file = ~/.ssh/ansible
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
forks = 10

[ssh_connection]
# 처음 보는 호스트 키는 받아들이고, 바뀐 키는 거부한다(VM 재생성 시 known_hosts 에서 지운 뒤 다시 실행).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
